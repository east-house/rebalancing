name: Refresh managed ETF research data

on:
  schedule:
    - cron: "20 23 * * 5"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-etf-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: >-
          python -m pip install
          "finance-datareader>=0.9,<1"
          "beautifulsoup4>=4.12,<5"
          "boto3>=1.34,<2"
      - name: Build, validate, and publish immutable bundles
        run: >-
          python scripts/build_etf_research_data.py
          --output-dir action-output
          --upload-r2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-research-${{ github.run_id }}
          path: action-output/
          retention-days: 7
