name: Publish I1 portfolio report at 19 KST
on:
  schedule:
    - cron: "0 19 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "30 19 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0 20 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Explicit Korean report date; empty retries due unpublished dates"
        required: false
        type: string
      initialize_only:
        description: "Preserve existing portfolio archive and initialize the independent schedule only"
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: production-portfolio-evening
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-portfolio-evening-${{ github.run_id }}
          restore-keys: market-report-${{ runner.os }}-
      - name: Install dependencies and fonts
        run: bash scripts/install-report-dependencies.sh
      - name: Validate report pipeline
        run: python -m pytest tests/market_report_pipeline -q
      - name: Publish due I1 reports
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.as_of }}
          INITIALIZE_ONLY: ${{ inputs.initialize_only || false }}
        run: |
          args=()
          if [[ -n "${REQUESTED_DATE}" ]]; then args+=(--as-of "${REQUESTED_DATE}"); fi
          if [[ "${INITIALIZE_ONLY}" == "true" ]]; then args+=(--initialize-only); fi
          python -m market_report_pipeline.portfolio_evening "${args[@]}"
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-portfolio-evening-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portfolio-evening-${{ github.run_id }}
          path: action-output/portfolio-evening/
          if-no-files-found: ignore
          retention-days: 30
