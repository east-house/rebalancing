name: Publish daily IRCS trading-test report

on:
  schedule:
    - cron: "13 19,21,23 * * 2-6"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Explicit Korean date; empty reconciles missing slots"
        required: false
        type: string
      reset_ledger:
        description: "Preserved revision/rebuild; requires explicit as_of"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-ircs-trading-test-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-trading-${{ github.run_id }}
          restore-keys: market-report-${{ runner.os }}-
      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m pip install --requirement requirements-market-report.txt
      - name: Validate report pipeline
        run: python -m pytest tests/market_report_pipeline -q
      - name: Reconcile and publish complete releases
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.as_of }}
          REVISE: ${{ inputs.revise || false }}
          RESET_LEDGER: ${{ inputs.reset_ledger || false }}
          REPAIR_INDEX: ${{ inputs.repair_index || false }}
        run: |
          args=(trading)
          if [[ -n "${REQUESTED_DATE}" ]]; then args+=(--as-of "${REQUESTED_DATE}"); fi
          if [[ "${REVISE}" == "true" ]]; then args+=(--revise); fi
          if [[ "${RESET_LEDGER}" == "true" ]]; then args+=(--reset-ledger); fi
          if [[ "${REPAIR_INDEX}" == "true" ]]; then args+=(--repair-index); fi
          mkdir -p action-output
          set -o pipefail
          python -m market_report_pipeline.daily_reports "${args[@]}" 2>&1 | tee action-output/daily.log
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-trading-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: trading-report-${{ github.run_id }}
          path: action-output/
          if-no-files-found: warn
          retention-days: 30
