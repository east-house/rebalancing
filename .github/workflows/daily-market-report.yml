name: Generate and publish daily US market report

on:
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Korean run date (YYYY-MM-DD); leave empty for today"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-daily-market-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt

      - name: Restore incremental market-data cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-report-${{ runner.os }}-

      - name: Install report dependencies and Korean fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m pip install --requirement requirements-market-report.txt

      - name: Validate report pipeline
        run: python -m pytest tests/market_report_pipeline -q

      - name: Resolve Korean run date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.as_of }}
        run: |
          if [[ -n "${REQUESTED_DATE}" ]]; then
            run_date="${REQUESTED_DATE}"
          else
            run_date="$(TZ=Asia/Seoul date +%F)"
          fi
          if [[ ! "${run_date}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid as_of date: ${run_date}"
            exit 1
          fi
          day_of_week="$(date -d "${run_date}" +%u)"
          if (( day_of_week >= 6 )); then
            echo "::error::Weekend reports are not published: ${run_date}"
            exit 1
          fi
          echo "RUN_DATE=${run_date}" >> "${GITHUB_ENV}"
          echo "REPORT_OUTPUT=action-output/market-report/${run_date}" >> "${GITHUB_ENV}"

      - name: Validate R2 configuration
        shell: bash
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret or variable: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Collect data and generate report
        run: >-
          python -m market_report_pipeline.us_market_report run
          --as-of "${{ env.RUN_DATE }}"
          --output "${{ env.REPORT_OUTPUT }}"

      - name: Build and publish portfolio decision report
        run: >-
          python -m market_report_pipeline.us_daily_portfolio_report
          --as-of "${{ env.RUN_DATE }}"
          --output "action-output/portfolio-report/latest.json"
          --allow-stale-preview
          --upload-r2

      - name: Build web bundle and publish to R2
        run: >-
          python -m market_report_pipeline.publish_market_report_web
          --source "${{ env.REPORT_OUTPUT }}"
          --project-root .
          --upload-r2

      - name: Upload report diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: |
            action-output/market-report/
            action-output/portfolio-report/
          if-no-files-found: warn
          retention-days: 7
