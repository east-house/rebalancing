name: Generate and publish daily US market report

on:
  schedule:
    - cron: "30 7,9,11 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Explicit Korean date; empty reconciles missing slots"
        required: false
        type: string
      revise:
        description: "Preserved revision/rebuild; requires explicit as_of"
        default: false
        type: boolean
      repair_index:
        description: "Recover the archive index without new collection"
        default: false
        type: boolean
      recover_history:
        description: "Retry historical recovery only (not daily publication)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-daily-market-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-morning-${{ github.run_id }}
          restore-keys: market-report-${{ runner.os }}-
      - name: Install dependencies and fonts
        run: |
          bash scripts/install-report-dependencies.sh
      - name: Validate report pipeline
        run: python -m pytest tests/market_report_pipeline -q
      - name: Reconcile and publish complete releases
        shell: bash
        env:
          PRICE_DIAGNOSTICS_DIR: action-output/price-http-evidence
          REQUESTED_DATE: ${{ inputs.as_of }}
          REVISE: ${{ inputs.revise || false }}
          RESET_LEDGER: ${{ inputs.reset_ledger || false }}
          REPAIR_INDEX: ${{ inputs.repair_index || false }}
          RECOVER_HISTORY: ${{ inputs.recover_history || false }}
        run: |
          args=(morning)
          if [[ -n "${REQUESTED_DATE}" ]]; then args+=(--as-of "${REQUESTED_DATE}"); fi
          if [[ "${REVISE}" == "true" ]]; then args+=(--revise); fi
          if [[ "${RESET_LEDGER}" == "true" ]]; then args+=(--reset-ledger); fi
          if [[ "${REPAIR_INDEX}" == "true" ]]; then args+=(--repair-index); fi
          if [[ "${RECOVER_HISTORY}" == "true" ]]; then args+=(--recover-history); fi
          mkdir -p action-output
          set -o pipefail
          python -m market_report_pipeline.daily_reports "${args[@]}" 2>&1 | tee action-output/daily.log
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-morning-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: morning-report-${{ github.run_id }}
          path: action-output/
          if-no-files-found: warn
          retention-days: 30
