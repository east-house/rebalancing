name: Diagnose price availability and timing

on:
  schedule:
    - cron: "10 7-16 * * 1-6"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-availability-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      DIAGNOSTIC_SCHEDULE: ${{ github.event.schedule || 'manual' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt
      - run: python -m pip install --retries 5 --timeout 30 --requirement requirements-market-report.txt
      - name: Compare all symbols on both endpoints and retain timing history
        run: python -m market_report_pipeline.price_diagnostics --upload-r2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: price-availability-${{ github.run_id }}
          path: action-output/price-diagnostics/
          if-no-files-found: warn
          retention-days: 90
