name: Refresh start-date trading replays

on:
  workflow_run:
    workflows: ["Publish daily IRCS trading-test report"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-replays
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-market-report.txt
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/cache/market-report
            data/raw/us_market
          key: market-report-${{ runner.os }}-replay-${{ github.run_id }}
          restore-keys: market-report-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements-market-report.txt
      - name: Test replay validation
        run: python -m pytest tests/market_report_pipeline/test_trading_replay.py -q
      - name: Refresh and verify isolated reports
        run: |
          python -m market_report_pipeline.refresh_trading_replays
          python scripts/verify_trading_replays.py
      - name: Publish validated replay files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/trading-replays
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh validated start-date replays"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: replay-audit-${{ github.run_id }}
          path: action-output/replay-refresh/
          retention-days: 30
